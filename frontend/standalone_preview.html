    @keyframes wellRipple {

        opacity: 0.75;
      }
      100% {
        transform: scale(1.65);
        opacity: 0;
      }
    }

    @keyframes floatLantern {
      0%, 100% {
        transform: translateY(0px) rotate(-1deg);
      }
      50% {
        transform: translateY(-7px) rotate(1deg);
      }

    @keyframes coinDrop {
      0% {
        transform: translateY(-38px) scale(1);
        opacity: 0;

      20% {
        opacity: 1;
      }
      85% {
        transform: translateY(22px) scale(0.85);
        opacity: 1;
      }
      100% {
        transform: translateY(34px) scale(0.3);
        opacity: 0;

      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    .animate-well-ripple {
      animation: wellRipple 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .animate-well-ripple-delay {
      animation: wellRipple 3.2s cubic-bezier(0.22, 1, 0.36, 1) 1.6s infinite;

    .animate-float-lantern {
      animation: floatLantern 4.5s ease-in-out infinite;
    }

    .animate-coin-drop {
      animation: coinDrop 0.9s cubic-bezier(0.45, 0, 0.55, 1) forwards;

      animation: shimmerWater 5s linear infinite;

      { home: "St. Mary's Children's Haven", item: "15 Winter Fleece Blankets", city: "Mumbai", ripple: "#482" },
      { home: "Little Angels Home", item: "24 Math Textbooks", city: "Mysuru", ripple: "#481" },
      { home: "Hope Ridge Care Haven", item: "30 Hygiene Care Kits", city: "Bengaluru", ripple: "#480" },
    ];

    function App() {
      const [role, setRole] = useState('guest');
      const [view, setView] = useState('landing');
      const [wishes, setWishes] = useState(INITIAL_WISHES);
      const [claims, setClaims] = useState(INITIAL_CLAIMS);
      const [selectedWish, setSelectedWish] = useState(null);
      const [claimModalOpen, setClaimModalOpen] = useState(false);
      const [claimQty, setClaimQty] = useState(1);
      const [show409Error, setShow409Error] = useState(false);
      const [duplicateStepActive, setDuplicateStepActive] = useState(false);
      const [newWishName, setNewWishName] = useState("Grade 8 NCERT Mathematics Notebook");
      const [auditValid, setAuditValid] = useState(null);
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [categoryFilter, setCategoryFilter] = useState("All");
      const [rippleCount, setRippleCount] = useState(482);
      const [coinAnimating, setCoinAnimating] = useState(false);
      const [tickerIdx, setTickerIdx] = useState(0);
      const [apiConnected, setApiConnected] = useState(false);
      const [activeStep, setActiveStep] = useState(0);

      const notify = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Rotate live ripple ticker
      useEffect(() => {
        const id = setInterval(() => {
          setTickerIdx(i => (i + 1) % TICKER_ITEMS.length);
        }, 4000);
        return () => clearInterval(id);
      }, []);

      // Try connecting to live local FastAPI backend on port 8000 (gracefully falls back to demo state if offline)
      useEffect(() => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1500);
        fetch('http://127.0.0.1:8000/api/wishes?limit=12', { signal: controller.signal })
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(data => {
            if (data && Array.isArray(data.items) && data.items.length > 0) {
              const mapped = data.items.map(w => ({
                id: w.wish_id,
                category: w.category_name,
                title: w.wish_title,
                item: w.item_name,
                desc: w.wish_description,
                requested: w.qty_requested,
                claimed: w.qty_claimed,
                remaining: w.qty_remaining,
                home: w.institution_name,
                city: `${w.institution_city}, ${w.institution_state}`,
                neededBy: (w.needed_by || '').slice(0, 10),
                status: w.wish_status,
              }));
              setWishes(mapped);
              setApiConnected(true);
            }
          })
          .catch(() => {

                  <span className="ml-auto text-xs font-bold text-slateink-500">{filteredWishes.length} active wishes</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredWishes.map(w => {
                    const pct = Math.min(100, Math.round((w.claimed / w.requested) * 100));
                    return (
                      <div key={w.id} className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm hover:shadow-xl hover:border-spring-400 transition space-y-4 flex flex-col justify-between">
                        <div className="space-y-2.5">
                          <div className="flex justify-between items-center text-[10px] font-bold">
                            <span className="px-2.5 py-0.5 rounded-full bg-spring-50 text-spring-700 border border-spring-200">{w.category}</span>
                            <span className={`px-2.5 py-0.5 rounded-full ${w.status === 'claimed' ? 'bg-well-800 text-coin-300' : 'bg-coin-100 text-coin-600'}`}>
                              {w.status.replace('_', ' ')}
                            </span>
                          </div>
                          <h3 className="font-serif text-lg font-bold text-slateink-900">{w.title}</h3>
                          <p className="text-xs text-spring-600 font-semibold">Item: {w.item}</p>
                          <p className="text-xs text-slateink-600 line-clamp-2">{w.desc}</p>
                          <div className="pt-2 text-[11px] text-slateink-500 border-t border-stone-200 flex justify-between">
                            <span><strong className="text-slateink-800">{w.home}</strong> &bull; {w.city}</span>
                            <span>Due {w.neededBy}</span>
                          </div>
                          <div className="space-y-1 pt-1">
                            <div className="flex justify-between text-xs font-bold text-slateink-700">
                              <span>{w.claimed} / {w.requested} pledged</span>
                              <span className="text-spring-600">{w.remaining} remaining</span>
                            </div>
                            <div className="w-full bg-stone-200 h-2.5 rounded-full overflow-hidden">
                              <div className="water-progress h-full rounded-full transition-all" style={{ width: `${pct}%` }} />
                            </div>
                          </div>
                        </div>
                        <button
                          disabled={w.remaining === 0}
                          onClick={() => { setSelectedWish(w); setClaimQty(1); setShow409Error(false); setClaimModalOpen(true); }}
                          className={`w-full py-2.5 rounded-xl text-xs font-bold shadow transition ${w.remaining > 0 ? 'bg-well-900 hover:bg-well-800 text-coin-300' : 'bg-stone-200 text-slateink-400 cursor-not-allowed'}`}
                        >
                          {w.remaining > 0 ? 'Drop a Pledge &rarr;' : 'Fully Pledged'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW 3: DONOR MY CLAIMS */}
            {view === 'my_claims' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="border-b border-stone-300 pb-4 flex justify-between items-end">
                  <div>
                    <span className="text-xs font-bold text-spring-600 uppercase tracking-widest">Donor Fulfillment</span>
                    <h2 className="font-serif text-3xl font-bold text-slateink-900">My Pledged Ripples</h2>
                    <p className="text-xs text-slateink-600 mt-1">Track shipments and deadlines. Overdue pledges are returned to the well by <code>sp_release_stale_claims</code>.</p>
                  </div>
                  <button onClick={() => setView('browse')} className="px-4 py-2 rounded-xl bg-well-900 text-coin-300 text-xs font-bold">+ Pledge Another</button>
                </div>
                <div className="space-y-4">
                  {claims.map(c => (
                    <div key={c.id} className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-mono text-slateink-400">Claim #{c.id}</span>
                          <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase ${c.status === 'active' ? 'bg-coin-100 text-coin-600' : c.status === 'delivered' ? 'bg-spring-100 text-spring-700' : 'bg-stone-200 text-slateink-600'}`}>{c.status}</span>
                        </div>
                        <h3 className="font-serif text-lg font-bold text-slateink-900 mt-1">{c.qty}x {c.item}</h3>
                        <p className="text-xs text-slateink-600">{c.home} &bull; Deadline: <strong className="text-slateink-800">{c.deadline}</strong></p>
                      </div>
                      <div className="flex space-x-2">
                        {c.status === 'active' && (
                          <>
                            <button onClick={() => handleReleaseClaim(c.id)} className="px-3.5 py-2 rounded-xl border border-stone-300 text-xs font-bold text-slateink-700 hover:bg-stone-100">Release Claim</button>
                            <button onClick={() => { setClaims(claims.map(x => x.id === c.id ? { ...x, status: 'delivered' } : x)); notify(`Claim #${c.id} marked as delivered! Home director notified to upload item photo proof.`); }} className="px-4 py-2 rounded-xl bg-well-900 text-coin-300 text-xs font-bold hover:bg-well-800">Mark Delivered &rarr;</button>
                          </>
                        )}
                        {c.status === 'delivered' && (
                          <span className="text-xs font-bold text-spring-700 bg-spring-50 px-3 py-1.5 rounded-xl border border-spring-200">Awaiting Item Photo Proof</span>
                        )}
                        {c.status === 'released' && (
                          <span className="text-xs text-slateink-400 font-medium">Returned to Well</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: PERSONAL IMPACT */}
            {view === 'impact' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="bg-well-900 text-stone-100 rounded-3xl p-8 border border-well-700">
                  <span className="text-xs font-bold text-coin-400 uppercase tracking-widest">Your Wellspring Legacy</span>
                  <h2 className="font-serif text-3xl font-bold mt-1">Your Kindness Ripples</h2>
                  <p className="text-xs text-stone-300 mt-1">Every delivered item verified with physical item-only photo proof.</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="p-7 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-ember-600 uppercase">Wishes Fulfilled</span>
                    <div className="font-serif text-4xl font-bold text-slateink-900 mt-2">12</div>
                  </div>
                  <div className="p-7 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-spring-600 uppercase">Physical Items Delivered</span>
                    <div className="font-serif text-4xl font-bold text-spring-700 mt-2">85</div>
                  </div>
                  <div className="p-7 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-coin-600 uppercase">Partner Homes Helped</span>
                    <div className="font-serif text-4xl font-bold text-slateink-900 mt-2">4</div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 5: INSTITUTION ONBOARDING */}
            {view === 'inst_onboarding' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="border-b border-stone-300 pb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                  <div>
                    <h2 className="font-serif text-3xl font-bold text-slateink-900">St. Mary&apos;s Children&apos;s Haven</h2>
                    <p className="text-xs text-slateink-600">Reg: REG-MH-2018-0912 &bull; Two-Step Verification Lifecycle</p>
                  </div>
                  <span className="self-start px-3.5 py-1 bg-spring-100 text-spring-700 text-xs font-bold rounded-full border border-spring-200">Status: Verified</span>
                </div>

                <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm space-y-4">
                  <h3 className="font-serif text-lg font-bold">Verification State Machine</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    {[
                      { step: "1. Registration", note: "Legal documents uploaded" },
                      { step: "2. Field Inspection", note: "Physical premises verified" },
                      { step: "3. Admin Sign-Off", note: "Final compliance approved" },
                      { step: "4. Wish Casting", note: "Active wish privileges" },
                    ].map((st, i) => (
                      <div key={i} className="p-4 rounded-2xl bg-spring-50 border border-spring-200 text-xs">
                        <span className="font-bold text-spring-700">{st.step}</span>
                        <p className="text-slateink-600 mt-1">&check; {st.note}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 6: CREATE WISH + JACCARD DUPLICATE CHECK */}
            {view === 'inst_create' && (
              <div className="max-w-2xl mx-auto px-4 py-10">
                <div className="p-8 rounded-3xl bg-white border border-stone-300 shadow-md space-y-6">
                  <div>
                    <span className="text-xs font-bold text-spring-600 uppercase tracking-widest">Institution Wish Form</span>
                    <h2 className="font-serif text-2xl font-bold text-slateink-900 mt-1">Cast a New Wish into the Well</h2>
                    <p className="text-xs text-slateink-600 mt-1">Includes explainable Jaccard token-overlap (&ge; 50%) duplicate detection.</p>
                  </div>

                  {duplicateStepActive && (
                    <div className="p-5 rounded-2xl bg-coin-50 border-2 border-coin-400 text-xs space-y-3">
                      <div className="font-bold text-well-900 flex items-center justify-between">
                        <span>Potential Duplicate Need Detected (HTTP 409)</span>
                        <span className="px-2 py-0.5 rounded-full bg-coin-400 text-well-950 font-mono">{jaccardPreview}% overlap</span>
                      </div>
                      <p className="text-slateink-700 leading-relaxed">
                        Your item <strong>&ldquo;{newWishName}&rdquo;</strong> overlaps with open Wish #1 (&ldquo;A4 Grid Math Notebooks &amp; Geometry Box&rdquo;). Revise details or override with <code>confirm_duplicate=True</code>.
                      </p>
                      <div className="flex space-x-2 pt-1">
                        <button onClick={() => setDuplicateStepActive(false)} className="px-3.5 py-1.5 rounded-xl bg-white border border-coin-400 font-bold text-well-900">Revise Details</button>
                        <button onClick={() => { setDuplicateStepActive(false); notify("Wish cast into the well with confirm_duplicate=True!"); setView('browse'); }} className="px-3.5 py-1.5 rounded-xl bg-well-900 text-coin-300 font-bold">Confirm &amp; Cast Anyway</button>
                      </div>
                    </div>
                  )}

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-slateink-700 uppercase">Item Name</label>
                      <input
                        value={newWishName}
                        onChange={(e) => setNewWishName(e.target.value)}
                        className="w-full mt-1 p-3 rounded-xl border border-stone-300 bg-stone-50 focus:border-spring-500 focus:outline-none"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="font-bold text-slateink-700 uppercase">Quantity Needed</label>
                        <input type="number" defaultValue="20" className="w-full mt-1 p-3 rounded-xl border border-stone-300 bg-stone-50" />
                      </div>
                      <div>
                        <label className="font-bold text-slateink-700 uppercase">Needed-By Date</label>
                        <input type="date" defaultValue="2026-12-15" className="w-full mt-1 p-3 rounded-xl border border-stone-300 bg-stone-50" />
                      </div>
                    </div>
                    <button onClick={() => setDuplicateStepActive(true)} className="w-full py-3 rounded-xl bg-well-900 hover:bg-well-800 text-coin-300 font-bold shadow transition">
                      Validate &amp; Cast Wish into Well
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 7: VERIFIER QUEUE */}
            {view === 'verifier_queue' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="border-b border-stone-300 pb-4">
                  <span className="text-xs font-bold text-spring-600 uppercase tracking-widest">Step 1 Verification</span>
                  <h2 className="font-serif text-3xl font-bold text-slateink-900">Field Verifier Inspection Queue</h2>
                  <p className="text-xs text-slateink-600 mt-1">Inspect private Azurite SAS registration records and confirm physical premises.</p>
                </div>
                <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-serif text-xl font-bold text-slateink-900">Hope Village Child Center</h3>
                    <span className="text-xs font-bold text-coin-600 bg-coin-100 px-3 py-1 rounded-full">Pending Inspection</span>
                  </div>
                  <p className="text-xs text-slateink-600">New Delhi, Delhi &bull; Reg: REG-DL-2022-7731</p>
                  <div className="text-xs p-3.5 rounded-xl bg-well-900 text-spring-200 font-mono">
                    SAS Blob: registration_certificate.pdf (?se=15m&amp;sp=r&amp;sig=...)
                  </div>
                  <div className="flex justify-end space-x-3 pt-2">
                    <button onClick={() => notify("Institution rejected with documented audit note.", "error")} className="px-4 py-2 rounded-xl border border-rose-300 text-rose-700 text-xs font-bold">Reject</button>
                    <button onClick={() => notify("Inspection verified! Recommended for Admin Approval.")} className="px-5 py-2 rounded-xl bg-spring-600 text-white text-xs font-bold hover:bg-spring-700">Recommend Institution &rarr;</button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 8: ADMIN ANALYTICS */}
            {view === 'admin_analytics' && (
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="border-b border-stone-300 pb-4 flex flex-col sm:flex-row justify-between sm:items-end gap-3">
                  <div>
                    <span className="text-xs font-bold text-spring-600 uppercase tracking-widest">Power BI JSON Feed</span>
                    <h2 className="font-serif text-3xl font-bold text-slateink-900">Wellspring Executive Analytics</h2>
                  </div>
                  <button onClick={() => notify("Stored procedure sp_release_stale_claims executed! 0 overdue claims expired.")} className="px-4 py-2.5 bg-well-900 text-coin-300 text-xs font-bold rounded-xl shadow">
                    Run sp_release_stale_claims
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-5">
                  <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-slateink-500 uppercase">Avg Delivery Lead Time</span>
                    <div className="font-serif text-3xl font-bold mt-2">4.2 <span className="text-sm font-normal">days</span></div>
                  </div>
                  <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-slateink-500 uppercase">Stale-Claim Rate</span>
                    <div className="font-serif text-3xl font-bold text-coin-600 mt-2">4.8%</div>
                  </div>
                  <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-slateink-500 uppercase">Fulfillment Rate</span>
                    <div className="font-serif text-3xl font-bold text-spring-600 mt-2">91.2%</div>
                  </div>
                  <div className="p-6 rounded-3xl bg-white border border-stone-300 shadow-sm text-center">
                    <span className="text-xs font-bold text-slateink-500 uppercase">Verified Homes</span>
                    <div className="font-serif text-3xl font-bold text-slateink-900 mt-2">18</div>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 9: CRYPTOGRAPHIC AUDIT LOG */}
            {view === 'admin_audit' && (
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-6">
                <div className="border-b border-stone-300 pb-4 flex flex-col sm:flex-row justify-between sm:items-end gap-3">
                  <div>
                    <span className="text-xs font-bold text-spring-600 uppercase tracking-widest">Append-Only Ledger</span>
                    <h2 className="font-serif text-3xl font-bold text-slateink-900">SHA-256 Cryptographic Audit Chain</h2>
                    <p className="text-xs text-slateink-600 mt-1">Direct UPDATE/DELETE blocked by database triggers.</p>
                  </div>
                  <button
                    onClick={() => {
                      setAuditValid(true);
                      notify("Chain verified: 5/5 blocks valid with zero broken hash links!");
                    }}
                    className="px-5 py-2.5 bg-well-900 hover:bg-well-800 text-coin-300 text-xs font-bold rounded-xl shadow"
                  >
                    &check; Verify Chain Integrity
                  </button>
                </div>

                {auditValid && (
                  <div className="p-4 rounded-2xl bg-spring-50 border border-spring-400 text-spring-700 text-xs font-bold flex items-center space-x-2">
                    <span className="w-5 h-5 rounded-full bg-spring-600 text-white flex items-center justify-center">&check;</span>
                    <span>100% Valid Cryptographic Chain: No broken pointers or tampered rows detected.</span>
                  </div>
                )}

                <div className="bg-white rounded-3xl border border-stone-300 overflow-x-auto shadow-sm">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-well-900 text-coin-300 font-sans uppercase text-[10px]">
                      <tr>
                        <th className="p-3.5">Block</th>
                        <th className="p-3.5">Entity</th>
                        <th className="p-3.5">Action</th>
                        <th className="p-3.5">Prev Hash</th>
                        <th className="p-3.5">Record Hash</th>
                        <th className="p-3.5">Timestamp</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-200">
                      {AUDIT_LOGS.map(log => (
                        <tr key={log.id} className="hover:bg-stone-100">
                          <td className="p-3.5 font-bold text-slateink-900 font-sans">#{log.id}</td>
                          <td className="p-3.5 font-sans text-slateink-800">{log.entity}</td>
                          <td className="p-3.5 text-spring-700 font-bold font-sans">{log.action}</td>
                          <td className="p-3.5 text-[10px] text-slateink-400">{log.prev.slice(0, 12)}...</td>
                          <td className="p-3.5 text-[10px] text-well-700 font-bold">{log.hash.slice(0, 12)}...</td>
                          <td className="p-3.5 text-[10px] text-slateink-500 font-sans">{log.date}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* PLEDGE MODAL */}
          {claimModalOpen && selectedWish && (
            <div className="fixed inset-0 bg-well-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-5 border border-stone-300 shadow-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold text-spring-600 uppercase tracking-wider">{selectedWish.category}</span>
                    <h3 className="font-serif text-xl font-bold text-slateink-900 mt-0.5">{selectedWish.title}</h3>
                    <p className="text-xs text-slateink-500">{selectedWish.home}</p>
                  </div>
                  <button onClick={() => setClaimModalOpen(false)} className="text-slateink-400 hover:text-slateink-800 text-xl font-bold">&times;</button>
                </div>

                <div className="p-3.5 rounded-2xl bg-stone-100 text-xs flex justify-between items-center border border-stone-200">
                  <span>Available in the well:</span>
                  <span className="font-bold text-spring-700">{selectedWish.remaining} item(s)</span>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-bold text-slateink-700 uppercase">Pledge Quantity</label>
                  <div className="flex items-center space-x-3">
                    <button onClick={() => setClaimQty(Math.max(1, claimQty - 1))} className="w-10 h-10 rounded-xl bg-stone-200 font-bold text-lg hover:bg-stone-300">-</button>
                    <span className="font-serif text-xl font-bold w-12 text-center">{claimQty}</span>
                    <button onClick={() => setClaimQty(Math.min(selectedWish.remaining, claimQty + 1))} className="w-10 h-10 rounded-xl bg-stone-200 font-bold text-lg hover:bg-stone-300">+</button>
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-coin-50 border border-coin-300 text-xs text-well-900">
                  <strong>14-Day Delivery Window</strong>
                  <p className="text-[11px] text-slateink-700 mt-0.5">Bounded by the home&apos;s needed-by date ({selectedWish.neededBy}).</p>
                </div>

                <div className="pt-1 flex items-center space-x-2 text-xs text-slateink-600">
                  <input type="checkbox" id="sim409" checked={show409Error} onChange={(e) => setShow409Error(e.target.checked)} className="cursor-pointer" />
                  <label htmlFor="sim409" className="cursor-pointer select-none">Simulate 409 Concurrency Conflict</label>
                </div>

                <div className="flex justify-end space-x-3 pt-2 border-t border-stone-200">
                  <button onClick={() => setClaimModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slateink-600 hover:bg-stone-100">Cancel</button>
                  <button onClick={handlePledge} className="px-5 py-2.5 rounded-xl bg-well-900 hover:bg-well-800 text-coin-300 text-xs font-bold shadow">
                    Drop Pledge ({claimQty} Item{claimQty > 1 ? 's' : ''})
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STARLIT WELL FOOTER */}
          <footer className="bg-well-950 text-stone-200 border-t border-well-800 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div className="flex items-center space-x-2.5">
                <WishWellLogo size={28} />
                <span className="font-serif font-bold text-base text-stone-100">Wish<span className="text-coin-400">Well</span></span>
              </div>
              <p className="text-slateink-400 text-center">
                Strict Child Privacy Charter &bull; Zero Photos of Children &bull; Append-Only SHA-256 Audit Chain
              </p>
              <span className="text-coin-400 font-semibold">Starlit Wellspring Edition</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
